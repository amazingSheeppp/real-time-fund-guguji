<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#ecedf6",
                        "on-secondary-fixed": "#001d34",
                        "tertiary": "#813900",
                        "inverse-on-surface": "#eff0f9",
                        "tertiary-fixed-dim": "#ffb68c",
                        "outline": "#727783",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e1e2ea",
                        "secondary-container": "#4fafff",
                        "on-primary-fixed": "#001b3d",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#1565c0",
                        "tertiary-fixed": "#ffdbc9",
                        "on-surface-muted": "#9E9E9E",
                        "surface": "#f9f9ff",
                        "tertiary-container": "#a64c00",
                        "outline-variant": "#c2c6d4",
                        "secondary-fixed": "#cfe5ff",
                        "price-up": "#E53935",
                        "on-secondary-container": "#004069",
                        "on-primary-fixed-variant": "#00468c",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e1e2ea",
                        "market-closed": "#757575",
                        "surface-container-low": "#f2f3fb",
                        "primary": "#004d99",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#dae5ff",
                        "secondary": "#00629d",
                        "on-tertiary-fixed": "#321200",
                        "on-secondary-fixed-variant": "#004a78",
                        "on-background": "#191c21",
                        "secondary-fixed-dim": "#99cbff",
                        "on-tertiary-container": "#ffdece",
                        "on-tertiary-fixed-variant": "#753400",
                        "inverse-surface": "#2e3037",
                        "price-down": "#43A047",
                        "primary-fixed-dim": "#a9c7ff",
                        "surface-bright": "#f9f9ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d8dae2",
                        "surface-container-high": "#e7e8f0",
                        "surface-background": "#FFFFFF",
                        "surface-tint": "#005db7",
                        "on-surface": "#191c21",
                        "on-surface-variant": "#424752",
                        "primary-fixed": "#d6e3ff",
                        "background": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#a9c7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-horizontal": "1rem",
                        "list-item-padding": "1rem",
                        "gutter": "0.5rem",
                        "stack-gap": "0.75rem"
                    },
                    "fontFamily": {
                        "label-data-bold": ["Roboto Flex"],
                        "display-data": ["Roboto Flex"],
                        "headline-md": ["Roboto Flex"],
                        "body-lg": ["Roboto Flex"],
                        "label-sm": ["Roboto Flex"]
                    },
                    "fontSize": {
                        "label-data-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "display-data": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-surface font-body-lg">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-surface dark:bg-inverse-surface shadow-sm">
        <div class="flex items-center gap-4">
            <button
                class="w-10 h-10 flex items-center justify-center hover:bg-surface-container-high dark:hover:bg-surface-dim rounded-full transition-colors">
                <span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
            </button>
            <h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">设置</h1>
        </div>
        <div class="flex items-center">
            <button
                class="w-10 h-10 flex items-center justify-center hover:bg-surface-container-high dark:hover:bg-surface-dim rounded-full transition-colors">
                <span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">search</span>
            </button>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="pt-20 pb-24 px-4 max-w-2xl mx-auto space-y-2">
        <!-- Settings Group -->
        <div class="bg-surface-container-low rounded-xl overflow-hidden">
            <!-- Item 1: Auto Refresh -->
            <button
                class="w-full flex items-center justify-between p-list-item-padding hover:bg-surface-container-high transition-colors text-left border-b border-outline-variant/30">
                <div class="flex flex-col">
                    <span class="text-body-lg font-body-lg text-on-surface">自动刷新间隔</span>
                    <span class="text-label-sm font-label-sm text-on-surface-variant">当前: 30s</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
            <!-- Item 3: Feedback -->
            <button
                class="w-full flex items-center justify-between p-list-item-padding hover:bg-surface-container-high transition-colors text-left border-b border-outline-variant/30">
                <div class="flex flex-col">
                    <span class="text-body-lg font-body-lg text-on-surface">意见反馈</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
            <!-- Item 4: About -->
            <button
                class="w-full flex items-center justify-between p-list-item-padding hover:bg-surface-container-high transition-colors text-left">
                <div class="flex flex-col">
                    <span class="text-body-lg font-body-lg text-on-surface">关于</span>
                    <span class="text-label-sm font-label-sm text-on-surface-variant">版本 v1.0.0</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
        </div>
        <!-- Destructive Action Section -->
        <div class="bg-surface-container-low rounded-xl overflow-hidden mt-4">
            <!-- Item 2: Clear Data -->
            <button
                class="w-full flex items-center justify-between p-list-item-padding hover:bg-error-container/20 transition-colors text-left">
                <div class="flex flex-col">
                    <span class="text-body-lg font-body-lg text-error">清除所有数据</span>
                    <span class="text-label-sm font-label-sm text-on-error-container/70">清除后无法恢复</span>
                </div>
                <span class="material-symbols-outlined text-error">delete_forever</span>
            </button>
        </div>
    </main>

</body>

</html>
